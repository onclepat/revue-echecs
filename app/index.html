<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Revue</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button only-narrow" id="toggle-games" type="button" aria-label="Afficher les parties">☰</button>
    <div class="brand">Revue</div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <form class="import" id="import-form">
      <input id="user" placeholder="Pseudo Chess.com" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Pseudo Chess.com">
      <button class="button primary" type="submit">Importer</button>
    </form>
    <button class="icon-button" id="toggle-sound" type="button" aria-label="Sons"></button>
    <button class="icon-button" id="toggle-theme" type="button" aria-label="Thème"></button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="layout">
    <aside class="games" id="games" aria-label="Parties"></aside>

    <section class="stage" aria-label="Échiquier">
      <div class="player" id="player-top"></div>
      <div class="board-row">
        <div class="gauge" id="gauge" aria-hidden="true"><div class="gauge-fill" id="gauge-fill"></div></div>
        <div class="board" id="board"></div>
      </div>
      <div class="player" id="player-bottom"></div>
      <nav class="nav" aria-label="Navigation dans la partie">
        <button type="button" data-go="start" aria-label="Début">⏮</button>
        <button type="button" data-go="prev" aria-label="Coup précédent">◀</button>
        <button type="button" data-go="next" aria-label="Coup suivant">▶</button>
        <button type="button" data-go="end" aria-label="Fin">⏭</button>
      </nav>
      <div class="chart-card" id="chart-card" hidden>
        <div class="chart-head"><span>Vos chances de gain</span><span id="chart-now"></span></div>
        <svg id="chart" role="img" aria-label="Courbe des chances de gain"></svg>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Analyse"></aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
